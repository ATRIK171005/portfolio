<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrik Samanta | AI & ML Developer</title>
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>
    <div id="error-log" style="color: red; position: fixed; top: 0; left: 0; z-index: 9999; background: white; padding: 10px; display: none;"></div>
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML += msg + ' in ' + url + ' line ' + lineNo + '<br>';
            return false;
        };
        const originalConsoleError = console.error;
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            var log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML += 'Console Error: ' + args.map(a => typeof a === 'object' ? (a.message || JSON.stringify(a)) : a).join(' ') + '<br>';
        };
    </script>

    <script type="module" src="App.js"></script>
</body>
</html>
